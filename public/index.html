<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#075229">
<title>麻雀オンライン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻雀">
<style>
  :root{--gold:#e6b422;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;
    background:radial-gradient(ellipse at center,#0e7d44,#04321a);color:#fff;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  #app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  /* 牌 */
  .tile{position:relative;background:#fdfcf7;border-radius:.18em;overflow:hidden;
    box-shadow:0 .06em .05em rgba(90,70,40,.45),0 .14em .2em rgba(0,0,0,.38);display:inline-flex;flex:none;vertical-align:bottom;}
  .tile svg{width:100%;height:100%;display:block;pointer-events:none;}
  .tile.back{background:#c8862f;}
  /* 卓 */
  #board{position:absolute;inset:0;}
  #topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:.6vmin 1.4vmin;font-size:1.9vmin;font-weight:700;background:linear-gradient(#0b3f25,#072a18cc);z-index:10;}
  #topbar .num{color:var(--gold);}
  #topbar button{font:inherit;font-size:1.5vmin;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:.3vmin 1vmin;cursor:pointer;}
  #center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(20vmin,150px);
    background:linear-gradient(135deg,#0d4a2a,#0a3c22);border:2px solid rgba(255,255,255,.18);border-radius:12px;
    padding:1vmin 1.4vmin;text-align:center;z-index:5;line-height:1.3;}
  #center .big{font-size:2.6vmin;color:var(--gold);font-weight:800;}
  #center .sub{font-size:1.5vmin;opacity:.85;}
  #center .dora{display:flex;gap:.3vmin;justify-content:center;margin:.4vmin 0;}
  #center .dora .tile{width:2.5vmin;height:3.5vmin;}
  /* 座席 */
  .seat{position:absolute;z-index:6;text-align:center;font-weight:700;background:linear-gradient(#123c25,#0b2a1a);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:.4vmin 1vmin;font-size:2vmin;white-space:nowrap;box-shadow:0 2px 7px rgba(0,0,0,.4);}
  .seat.turn{border-color:var(--gold);box-shadow:0 0 12px rgba(230,180,34,.6);}
  .seat.riichi{color:#ffd54f;}
  .seat .wind{color:var(--gold);margin-right:.3vmin;}
  .seat .nm{font-size:1.3vmin;opacity:.8;font-weight:400;}
  .seat .cpu{font-size:1.2vmin;opacity:.65;font-weight:400;}
  .sc-bottom{left:50%;top:calc(50% + 14vmin);transform:translate(-50%,-50%);}
  .sc-top{left:50%;top:calc(50% - 14vmin);transform:translate(-50%,-50%);}
  .sc-left{left:calc(50% - 20vmin);top:50%;transform:translate(-50%,-50%);}
  .sc-right{left:calc(50% + 20vmin);top:50%;transform:translate(-50%,-50%);}
  /* 手牌 */
  .hand{position:absolute;display:flex;align-items:flex-end;gap:2px;z-index:7;}
  .hand.bottom{left:50%;bottom:1vmin;transform:translateX(-50%);}
  .hand.top{left:50%;top:1vmin;transform:translateX(-50%) rotate(180deg);}
  .hand.left{left:calc(var(--h)/2 + 1vmin);top:50%;transform:translate(-50%,-50%) rotate(90deg);}
  .hand.right{right:calc(var(--h)/2 + 1vmin);left:auto;top:50%;transform:translate(50%,-50%) rotate(-90deg);}
  :root{--h:7.4vmin;}
  .hand.bottom .tile{width:5.4vmin;height:7.4vmin;cursor:pointer;transition:transform .1s;}
  .hand.bottom .tile.drawn{margin-left:1.4vmin;}
  .hand .tile{width:5.4vmin;height:7.4vmin;}
  .hand.bottom .tile.sel,.hand.bottom .tile:active{transform:translateY(-1.4vmin);}
  .hand.bottom .tile.rec{outline:.35vmin solid var(--gold);outline-offset:-.35vmin;}
  /* 捨て牌 */
  .discards{position:absolute;display:grid;grid-auto-rows:min-content;gap:1px;z-index:3;grid-template-columns:repeat(6,auto);}
  .discards .tile{width:3.4vmin;height:4.8vmin;}
  .discards.bottom{left:50%;bottom:calc(var(--h) + 9vmin);transform:translateX(-50%);}
  .discards.top{left:50%;top:calc(var(--h) + 9vmin);transform:translateX(-50%) rotate(180deg);}
  .discards.left{left:calc(var(--h) + 9vmin);top:50%;transform:translateY(-50%) rotate(90deg);}
  .discards.right{right:calc(var(--h) + 9vmin);top:50%;transform:translateY(-50%) rotate(-90deg);}
  .discards .tile.tsumogiri{opacity:.72;}
  .discards .tile.last{box-shadow:0 0 0 2px var(--gold);}
  /* 鳴き */
  .melds{position:absolute;display:flex;gap:4px;z-index:6;}
  .melds .tile{width:3.4vmin;height:4.8vmin;}
  .melds.bottom{right:1vmin;bottom:1vmin;}
  .melds.top{left:1vmin;top:1vmin;transform:rotate(180deg);}
  .melds.left{left:1vmin;bottom:1vmin;transform:rotate(90deg);transform-origin:left bottom;}
  .melds.right{right:1vmin;top:1vmin;transform:rotate(-90deg);transform-origin:right top;}
  .meld{display:flex;gap:1px;}
  /* 操作ボタン */
  #controls{position:absolute;left:50%;bottom:10vmin;transform:translateX(-50%);z-index:20;display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center;}
  .abtn{background:linear-gradient(#e6b422,#cf9c14);color:#3a2a00;border:none;padding:1.2vmin 2.6vmin;border-radius:10px;
    font-size:2.4vmin;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #9a7400;}
  .abtn.win{background:linear-gradient(#ff5252,#d32f2f);color:#fff;box-shadow:0 3px 0 #8a1c1c;}
  .abtn.skip{background:linear-gradient(#6b7b70,#55655a);color:#fff;box-shadow:0 3px 0 #33413a;}
  .abtn:active{transform:translateY(2px);box-shadow:none;}
  #msg{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);z-index:30;font-size:4vmin;font-weight:900;
    text-shadow:0 2px 0 #000;opacity:0;transition:opacity .2s;pointer-events:none;}
  #msg.show{opacity:1;}
  .callpop{position:absolute;z-index:25;font-size:3vmin;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #000;
    background:rgba(0,0,0,.55);padding:.4vmin 1.4vmin;border-radius:8px;animation:pop .8s;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{opacity:1}}
  /* ロビー / 結果 */
  .overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,25,14,.8);}
  .overlay.show{display:flex;}
  .sheet{background:linear-gradient(160deg,#173d26,#0d2417);border:2px solid var(--gold);border-radius:16px;
    padding:3vmin 3.5vmin;min-width:min(84vw,460px);max-height:88vh;overflow:auto;text-align:center;}
  .sheet h1{color:var(--gold);margin:.2em 0;font-size:5vmin;}
  .sheet h2{color:var(--gold);margin:.2em 0;}
  .sheet input{font:inherit;font-size:2.4vmin;padding:1vmin 1.4vmin;border-radius:8px;border:1px solid #888;width:60%;text-align:center;margin:1vmin 0;}
  .sheet .row{display:flex;gap:1.5vmin;justify-content:center;flex-wrap:wrap;margin-top:1vmin;}
  .seatctl{display:flex;gap:.6vmin;justify-content:center;flex-wrap:wrap;margin:1vmin 0;font-size:1.7vmin;}
  .seatctl .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:.4vmin 1vmin;cursor:pointer;}
  .final-table{width:100%;border-collapse:collapse;margin:1vmin 0;font-size:2.2vmin;}
  .final-table td{padding:.6vmin;border-top:1px solid rgba(255,255,255,.12);}
  .final-table tr.me{background:rgba(230,180,34,.16);font-weight:800;}
  .agari-tiles{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin:1vmin 0;}
  .agari-tiles .tile{width:4vmin;height:5.6vmin;}
  .yaku-list{list-style:none;padding:0;font-size:2vmin;text-align:left;max-width:40vmin;margin:1vmin auto;}
  .yaku-list li{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.15);padding:.2vmin 0;}
  .yaku-list .han{color:var(--gold);}
  #status{position:absolute;left:1vmin;bottom:1vmin;z-index:8;font-size:1.4vmin;opacity:.7;}
  #topbar #muteBtn.off{background:rgba(200,60,60,.3);border-color:rgba(255,120,120,.55);}
  /* ルール選択 */
  #rulesBox{display:flex;gap:.6vmin 1.8vmin;flex-wrap:wrap;justify-content:center;align-items:center;font-size:1.9vmin;margin:1vmin 0 .2vmin;}
  #rulesBox label{display:inline-flex;align-items:center;gap:.4vmin;cursor:pointer;white-space:nowrap;}
  #rulesBox input{width:auto!important;margin:0;transform:scale(1.2);}
  /* チャット/スタンプ */
  #chatPanel{position:absolute;left:50%;bottom:calc(var(--h) + 3vmin);transform:translateX(-50%);z-index:40;display:none;
    flex-direction:column;gap:.6vmin;background:rgba(6,32,20,.94);border:1px solid var(--gold);border-radius:12px;
    padding:1vmin 1.2vmin;max-width:min(94vw,540px);}
  #chatPanel.show{display:flex;}
  #stampRow{display:flex;gap:.5vmin;flex-wrap:wrap;justify-content:center;}
  #stampRow .stamp{font-size:2vmin;font-weight:700;color:#fff;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:.5vmin 1vmin;cursor:pointer;white-space:nowrap;}
  #stampRow .stamp:active{transform:translateY(1px);}
  #chatInputRow{display:flex;gap:.6vmin;}
  #chatText{flex:1;font:inherit;font-size:1.9vmin;padding:.5vmin 1vmin;border-radius:8px;border:1px solid #888;min-width:0;}
  #chatSend{font-size:1.9vmin;padding:.5vmin 1.4vmin;}
  .bubble{position:absolute;z-index:35;max-width:26vmin;font-size:1.9vmin;font-weight:700;color:#20130a;
    background:#fff;padding:.5vmin 1.1vmin;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.45);
    animation:bpop .25s;pointer-events:none;word-break:break-word;}
  .bubble .who{display:block;font-size:1.2vmin;font-weight:400;opacity:.6;}
  .bubble.big{font-size:3vmin;}
  @keyframes bpop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  /* タッチ端末では操作ボタンを押しやすいサイズに */
  @media (pointer:coarse){
    #topbar{font-size:2.3vmin;}
    #topbar button{font-size:15px;padding:6px 11px;border-radius:8px;}
    .abtn{font-size:17px;padding:11px 18px;}
    #stampRow .stamp{font-size:15px;padding:8px 12px;}
    #chatText,#chatSend{font-size:16px;}
    .sheet input{font-size:16px;}
  }
</style>
</head>
<body>
<!-- 牌スプライト -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <image id="tsheet" width="350" height="240" preserveAspectRatio="none" href="tiles.png"/>
</defs></svg>

<div id="app">
  <div id="board" style="display:none">
    <div id="topbar">
      <div><span id="roundLbl">東1局</span> <span class="num" id="wallLbl">70</span>枚 <span id="roomLbl" style="color:var(--gold);margin-left:1vmin"></span></div>
      <div><button id="chatBtn" title="スタンプ・チャット">💬</button> <button id="muteBtn" title="音のオン/オフ (M)">🔊</button> <button id="seatBtn">席</button> <button id="leaveBtn">退出</button></div>
    </div>
    <div id="center"></div>
    <div class="discards bottom" data-pos="0"></div><div class="discards right" data-pos="1"></div>
    <div class="discards top" data-pos="2"></div><div class="discards left" data-pos="3"></div>
    <div class="melds bottom" data-pos="0"></div><div class="melds right" data-pos="1"></div>
    <div class="melds top" data-pos="2"></div><div class="melds left" data-pos="3"></div>
    <div class="hand bottom" data-pos="0"></div><div class="hand right" data-pos="1"></div>
    <div class="hand top" data-pos="2"></div><div class="hand left" data-pos="3"></div>
    <div class="seat sc-bottom" data-pos="0"></div><div class="seat sc-right" data-pos="1"></div>
    <div class="seat sc-top" data-pos="2"></div><div class="seat sc-left" data-pos="3"></div>
    <div id="controls"></div>
    <div id="msg"></div>
    <div id="status">未接続</div>
    <div id="chatPanel">
      <div id="stampRow"></div>
      <div id="chatInputRow">
        <input id="chatText" maxlength="40" placeholder="メッセージ (40字まで)">
        <button id="chatSend" class="abtn">送信</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay show" id="gate"><div class="sheet">
  <h1>🀄 麻雀オンライン</h1>
  <p>入室するには合言葉が必要です。</p>
  <div><input id="pwInput" type="password" placeholder="合言葉" autocomplete="off" autocapitalize="off" maxlength="64"></div>
  <div class="row"><button class="abtn" id="pwBtn">入室</button></div>
  <div id="gateErr" style="color:#ff8a8a;font-size:1.8vmin;margin-top:1vmin;min-height:1.8vmin"></div>
</div></div>

<div class="overlay" id="lobby"><div class="sheet">
  <h1>麻雀オンライン</h1>
  <p>4人打ちリーチ麻雀。あなた＋人間/CPU3人。<br>途中参加・離脱(CPU代打ち)対応。</p>
  <div><input id="nameInput" placeholder="名前" maxlength="16"></div>
  <div id="rulesBox">
    <label><input type="radio" name="rule_len" value="tonpu" checked>東風戦</label>
    <label><input type="radio" name="rule_len" value="hanchan">半荘戦</label>
    <label><input type="checkbox" id="rule_aka" checked>赤ドラ</label>
    <label><input type="checkbox" id="rule_kuitan" checked>喰いタン</label>
    <label><input type="checkbox" id="rule_tobi" checked>トビ終了</label>
  </div>
  <div style="font-size:1.4vmin;opacity:.65;margin:-.3vmin 0 .8vmin">↑ ルールは「1人で」「ルームを作る」に反映（自動マッチング・参加は卓に従う）</div>
  <div class="row">
    <button class="abtn" id="soloBtn">1人で(CPU3人)</button>
    <button class="abtn" id="autoBtn">自動マッチング</button>
  </div>
  <hr style="border:none;border-top:1px solid rgba(255,255,255,.15);margin:2vmin 0;">
  <div style="font-size:1.7vmin;opacity:.85;margin-bottom:.6vmin">🔑 友人と対戦（合言葉）</div>
  <div class="row">
    <button class="abtn" id="roomCreateBtn">ルームを作る</button>
    <input id="roomCodeInput" placeholder="合言葉" maxlength="4" style="width:22%;text-transform:uppercase;letter-spacing:.3vmin">
    <button class="abtn" id="roomJoinBtn">参加</button>
  </div>
  <div id="lobbyErr" style="color:#ff8a8a;font-size:1.6vmin;margin-top:1vmin;min-height:1.6vmin"></div>
  <div id="lobbyInfo" style="margin-top:1vmin;font-size:1.7vmin;opacity:.8"></div>
  <div id="statsLine" style="margin-top:1vmin;font-size:1.6vmin;opacity:.9;border-top:1px solid rgba(255,255,255,.12);padding-top:1vmin"></div>
</div></div>

<div class="overlay" id="result"><div class="sheet" id="resultSheet"></div></div>
<div class="overlay" id="seatModal"><div class="sheet" id="seatSheet"></div></div>

<script>
"use strict";
const HONOR=["東","南","西","北","白","發","中"];
const COLX=[5,40,74,108,143,177,212,246,280,315], ROWY=[5,52,99,145,191], ROWH=[44,43,43,44,44], CELLW=31;
const HONOR_CELL={27:[3,0],28:[3,1],29:[4,0],30:[4,1],31:[3,2],32:[3,3],33:[4,2]}, BACK_CELL=[4,3];
const suitOf=t=>t<27?Math.floor(t/9):3, rankOf=t=>t<27?(t%9)+1:0;
function tileUV(t,aka){ if(t<27){const s=suitOf(t),r=rankOf(t);const col=aka?5:(r<=5?r-1:r);return[COLX[col],ROWY[s],CELLW,ROWH[s]];} const c=HONOR_CELL[t];return[COLX[c[1]],ROWY[c[0]],CELLW,ROWH[c[0]]]; }
function svgFace(t,aka,back){ let x,y,w,h; if(back){x=COLX[BACK_CELL[1]];y=ROWY[BACK_CELL[0]];w=CELLW;h=ROWH[BACK_CELL[0]];}else{const uv=tileUV(t,aka);x=uv[0];y=uv[1];w=uv[2];h=uv[3];} return `<svg viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="none"><use href="#tsheet"/></svg>`; }
function tileEl(t,opt={}){ const e=document.createElement("div"); e.className="tile"+(opt.cls?" "+opt.cls:""); if(opt.back){e.classList.add("back");e.innerHTML=svgFace(0,false,true);} else e.innerHTML=svgFace(t.t,!!t.aka,false); return e; }
function faceShort(t){ if(t>=27)return HONOR[t-27]; return (t%9+1)+["m","p","s"][suitOf(t)]; }

// ---- WebSocket ----
let ws, myId=null, myTable=null, mySeat=-1, state=null, pendingReact=null, myOptions=null, myRoomCode=null, isSpectator=false;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host);
  ws.onopen=()=>setStatus("接続済み");
  ws.onclose=()=>{ setStatus("切断 - 再接続中"); setTimeout(connect,1500); };
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function sendWS(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function setStatus(s){ document.getElementById("status").textContent=s; }

// =========================================================================
//  効果音 (Web Audioで合成) ＋ 掛け声 (SpeechSynthesis) — 単体版から移植
// =========================================================================
let audioMuted = false;
try{ audioMuted = (localStorage.getItem("mj_muted")==="1"); }catch(e){}
const Sound = {
  ctx:null,
  init(){ const AC=window.AudioContext||window.webkitAudioContext; if(!this.ctx){ if(!AC)return; try{this.ctx=new AC();}catch(e){this.ctx=null;return;} } if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); },
  tone(freq,dur,{type="sine",gain=.12,at=0,slide=0}={}){ if(audioMuted||!this.ctx)return; const t0=this.ctx.currentTime+at; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type;o.frequency.setValueAtTime(freq,t0); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t0+dur); g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(this.ctx.destination);o.start(t0);o.stop(t0+dur+.02); },
  clack(gain=.16){ if(audioMuted||!this.ctx)return; const len=Math.floor(this.ctx.sampleRate*.045); const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6); const src=this.ctx.createBufferSource();src.buffer=buf; const bp=this.ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1900;bp.Q.value=1.1; const g=this.ctx.createGain();g.gain.value=gain; src.connect(bp).connect(g).connect(this.ctx.destination);src.start(); },
  discard(){ this.clack(.13); }, draw(){ this.clack(.06); },
  call(){ this.clack(.18); this.tone(320,.12,{type:"triangle",gain:.13,at:.03}); },
  riichi(){ this.tone(660,.1,{type:"triangle",gain:.13}); this.tone(880,.18,{type:"triangle",gain:.13,at:.1}); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.3,{type:"triangle",gain:.13,at:i*.09})); },
  lose(){ this.tone(300,.35,{type:"sawtooth",gain:.1,slide:-160}); },
  ryuukyoku(){ [440,392,330].forEach((f,i)=>this.tone(f,.25,{type:"sine",gain:.11,at:i*.12})); },
};
const Voice = {
  jaVoices:[], allVoices:[], loaded:false,
  init(){ if(typeof speechSynthesis==="undefined")return; this.refresh(); try{speechSynthesis.onvoiceschanged=()=>this.refresh();}catch(e){} },
  refresh(){ if(typeof speechSynthesis==="undefined")return; this.allVoices=speechSynthesis.getVoices()||[]; this.jaVoices=this.allVoices.filter(v=>/^ja(\b|[-_])/i.test(v.lang)); this.loaded=this.allVoices.length>0; },
  norm(t){ return ({"ダブリー":"ダブルリーチ"})[t]||t; },
  say(text,pos=0){ if(audioMuted||typeof speechSynthesis==="undefined")return; if(!this.loaded)this.refresh(); const u=new SpeechSynthesisUtterance(this.norm(text)); u.lang="ja-JP"; const list=this.jaVoices.length?this.jaVoices:this.allVoices; if(list.length)u.voice=list[pos%list.length]; u.pitch=[1.15,.85,1.05,.75][pos%4]; u.rate=[1.08,1.0,1.02,.96][pos%4]; u.volume=1; try{speechSynthesis.speak(u);}catch(e){} },
};

function handle(m){
  switch(m.t){
    case "hello": myId=m.id; if(!m.needAuth) showLobby(); else document.getElementById("pwInput").focus(); break;
    case "authOk": showLobby(); break;
    case "authFail": gateFail(m.remaining); break;
    case "locked": gateLocked(m.seconds); break;
    case "lobby": renderLobby(m); break;
    case "joined": mySeat=m.seat; myTable=m.tableId; myRoomCode=m.roomCode||null; document.getElementById("lobby").classList.remove("show"); document.getElementById("board").style.display=""; document.getElementById("roomLbl").textContent=myRoomCode?("🔑"+myRoomCode):""; if(myRoomCode) flash("合言葉: "+myRoomCode+" (共有して友人を招待)",3000); break;
    case "spectating": isSpectator=true; document.getElementById("lobby").classList.remove("show"); document.getElementById("board").style.display=""; document.getElementById("roomLbl").textContent="👀 観戦中"; document.getElementById("seatBtn").style.display="none"; flash("👀 観戦モード",2000); break;
    case "error": document.getElementById("lobbyErr").textContent=m.msg; break;
    case "state": state=m.state; mySeat=state.seat; render(); break;
    case "yourTurn": myOptions=m.options; showTurnControls(); Sound.draw(); break;
    case "canReact": pendingReact=m; showReactControls(); break;
    case "call": popCall(m.seat, m.kind); onCallSound(m.seat, m.kind); break;
    case "discard": Sound.discard(); break;
    case "seatChange": flash((m.name||"席")+" 交代"); break;
    case "handEnd": showResult(m.result); onHandEndSound(m.result); Stats.recordHand(m.result); break;
    case "gameOver": showGameOver(m); Stats.recordGame(m); break;
    case "chat": showBubble(m.seat, m.stamp||m.text, m.name, !!m.stamp); break;
    case "handStart": document.getElementById("result").classList.remove("show"); break;
  }
}

function gateLocked(seconds){
  const inp=document.getElementById("pwInput"), btn=document.getElementById("pwBtn"), el=document.getElementById("gateErr");
  inp.disabled=true; btn.disabled=true; inp.value="";
  let s=Math.max(0,seconds|0);

    const mm=Math.floor(s/60), ss=String(s%60).padStart(2,"0");
    if(s>0){ el.textContent="間違いが3回に達しました。あと "+mm+":"+ss+" 待ってください。"; }

    s--;

  clearInterval(lockTimer); tick(); lockTimer=setInterval(tick,1000);

const Stats={
  key:"mj_stats",
  blank(){ return {games:0,r1:0,r2:0,r3:0,r4:0,pt:0,hands:0,wins:0}; },
  load(){ try{ return Object.assign(this.blank(), JSON.parse(localStorage.getItem(this.key)||"{}")); }catch(e){ return this.blank(); } },
  save(s){ try{ localStorage.setItem(this.key, JSON.stringify(s)); }catch(e){} },
  recordHand(result){ if(!result) return; const s=this.load(); s.hands++; if(result.winners && result.winners.some(w=>w.seat===mySeat)) s.wins++; this.save(s); },
  recordGame(m){ const e=(m.ranking||[]).find(x=>x.seat===mySeat); if(!e) return; const s=this.load(); s.games++; s["r"+e.rank]=(s["r"+e.rank]||0)+1; if(typeof e.pt==="number") s.pt+=e.pt; this.save(s); this.render(); },
  render(){ const el=document.getElementById("statsLine"); if(!el) return; const s=this.load();
    if(!s.games){ el.textContent="通算成績: まだありません"; return; }
    const avg=((s.r1+s.r2*2+s.r3*3+s.r4*4)/s.games).toFixed(2);
    const top=Math.round(100*s.r1/s.games), ren=Math.round(100*(s.r1+s.r2)/s.games);
    const wr=s.hands?(100*s.wins/s.hands).toFixed(1):"-";
    el.innerHTML=`通算 <b>${s.games}</b>戦 ・ 平均順位 <b>${avg}</b> ・ トップ率 ${top}% ・ 連対 ${ren}% ・ 和了率 ${wr}% ・ ポイント <b style="color:${s.pt>=0?'#7fffa0':'#ff8a8a'}">${s.pt>0?"+"+s.pt:s.pt}</b> <a href="#" id="statsReset" style="opacity:.6;margin-left:.8vmin">リセット</a>`;
    const rb=document.getElementById("statsReset"); if(rb) rb.onclick=(ev)=>{ ev.preventDefault(); if(confirm("通算成績をリセットしますか？")){ this.save(this.blank()); this.render(); } };
  }
};

    se.className="seat sc-"+["bottom","right","top","left"][pos]+(state.turn===p.seat?" turn":"")+(p.riichi?" riichi":"");
    se.innerHTML=`<div><span class="wind">${HONOR[p.wind]}</span>${p.score}</div><div class="nm">${p.name}${p.controller==="cpu"?'<span class="cpu"> [CPU]</span>':(p.connected?"":' <span class="cpu">[離席]</span>')}</div>`;
    // hand
    const he=document.querySelector(`.hand[data-pos="${pos}"]`); he.innerHTML="";
    if(p.hand){   // 手牌が見える席(自分／観戦時は全員)は表向きに表示
      p.hand.forEach(t=>{ const el=tileEl(t); el.onclick=()=>onTileClick(t); he.append(el); });
      if(p.drawn){ const el=tileEl(p.drawn,{cls:"drawn"}); el.onclick=()=>onTileClick(p.drawn); he.append(el); }
    }else{
      for(let i=0;i<p.handCount;i++) he.append(tileEl(null,{back:true}));
      if(p.drawnCount) he.append(tileEl(null,{back:true,cls:"drawn"}));
    }
    // discards
    const de=document.querySelector(`.discards[data-pos="${pos}"]`); de.innerHTML="";
    p.discards.forEach((d,i)=>{ const el=tileEl(d,{cls:(d.tsumogiri?"tsumogiri":"")+(i===p.discards.length-1&&state.turn!==p.seat?" ":"")}); de.append(el); });
    // melds
    const me=document.querySelector(`.melds[data-pos="${pos}"]`); me.innerHTML="";
    for(const m of p.melds){ const box=document.createElement("div"); box.className="meld"; (m.tiles||[]).slice().sort((a,b)=>a.t-b.t).forEach(t=>box.append(tileEl(t))); me.append(box); }
  }
  // 自分の手番でなければ操作クリア(反応中は別)
  if(!(myOptions && state.pending && state.pending.type==="turn")) {}
}

  h+='<div class="row"><button class="abtn skip" onclick="document.getElementById(\'seatModal\').classList.remove(\'show\')">閉じる</button></div>';
  sh.innerHTML=h; document.getElementById("seatModal").classList.add("show");
}

connect();
