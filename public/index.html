<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#075229">
<title>麻雀オンライン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻雀">
<style>
  :root{--gold:#e6b422;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;
    background:radial-gradient(ellipse at center,#0e7d44,#04321a);color:#fff;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  #app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  /* 牌 */
  .tile{position:relative;background:#fdfcf7;border-radius:.18em;overflow:hidden;
    box-shadow:0 .06em .05em rgba(90,70,40,.45),0 .14em .2em rgba(0,0,0,.38);display:inline-flex;flex:none;vertical-align:bottom;}
  .tile svg{width:100%;height:100%;display:block;pointer-events:none;}
  .tile.back{background:#c8862f;}
  /* 卓 */
  #board{position:absolute;inset:0;}
  #topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:.6vmin 1.4vmin;font-size:1.9vmin;font-weight:700;background:linear-gradient(#0b3f25,#072a18cc);z-index:10;}
  #topbar .num{color:var(--gold);}
  #topbar button{font:inherit;font-size:1.5vmin;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:.3vmin 1vmin;cursor:pointer;}
  #center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(20vmin,150px);
    background:linear-gradient(135deg,#0d4a2a,#0a3c22);border:2px solid rgba(255,255,255,.18);border-radius:12px;
    padding:1vmin 1.4vmin;text-align:center;z-index:5;line-height:1.3;}
  #center .big{font-size:2.6vmin;color:var(--gold);font-weight:800;}
  #center .sub{font-size:1.5vmin;opacity:.85;}
  #center .dora{display:flex;gap:.3vmin;justify-content:center;margin:.4vmin 0;}
  #center .dora .tile{width:2.5vmin;height:3.5vmin;}
  /* 座席 */
  .seat{position:absolute;z-index:6;text-align:center;font-weight:700;background:linear-gradient(#123c25,#0b2a1a);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:.4vmin 1vmin;font-size:2vmin;white-space:nowrap;box-shadow:0 2px 7px rgba(0,0,0,.4);}
  .seat.turn{border-color:var(--gold);box-shadow:0 0 12px rgba(230,180,34,.6);}
  .seat.riichi{color:#ffd54f;}
  .seat .wind{color:var(--gold);margin-right:.3vmin;}
  .seat .nm{font-size:1.3vmin;opacity:.8;font-weight:400;}
  .seat .cpu{font-size:1.2vmin;opacity:.65;font-weight:400;}
  /* 点数は河(中央十字)の腕の外側の対角に置く */
  .sc-bottom{left:calc(50% + 20vmin);top:calc(50% + 17.5vmin);transform:translate(-50%,-50%);}  /* 自分=右下 */
  .sc-right{left:calc(50% + 20vmin);top:calc(50% - 17.5vmin);transform:translate(-50%,-50%);}    /* 下家=右上 */
  .sc-top{left:calc(50% - 20vmin);top:calc(50% - 17.5vmin);transform:translate(-50%,-50%);}      /* 対面=左上 */
  .sc-left{left:calc(50% - 20vmin);top:calc(50% + 17.5vmin);transform:translate(-50%,-50%);}     /* 上家=左下 */
  /* 手牌 */
  .hand{position:absolute;display:flex;align-items:flex-end;gap:2px;z-index:7;}
  .hand.bottom{left:50%;bottom:1vmin;transform:translateX(-50%);flex-wrap:nowrap;justify-content:center;max-width:97vw;width:var(--myhw);row-gap:.8vmin;}
  .tsize-l .hand.bottom{flex-wrap:wrap;}   /* 大の時だけ2段 */
  .hand.top{left:50%;top:calc(var(--topbar-h,5vmin) + .8vmin);transform:translateX(-50%) rotate(180deg);}
  .hand.left{left:calc(var(--h)/2 + 1vmin);top:50%;transform:translate(-50%,-50%) rotate(90deg);}
  .hand.right{right:calc(var(--h)/2 + 1vmin);left:auto;top:50%;transform:translate(50%,-50%) rotate(-90deg);}
  :root{--h:7.4vmin; --myhtw:5.4vmin; --myhth:7.4vmin; --myh:7.4vmin; --myhw:auto;}
  /* 自分の手牌サイズ: 小(既定)/中/大(大は2段) */
  .tsize-m{--myhtw:6.5vmin; --myhth:8.9vmin; --myh:8.9vmin; --myhw:auto;}
  .tsize-l{--myhtw:11.4vmin; --myhth:15.5vmin; --myh:33vmin; --myhw:88vmin;}
  .hand.bottom .tile{width:var(--myhtw);height:var(--myhth);cursor:pointer;transition:transform .1s;}
  .hand.bottom .tile.drawn{margin-left:1.4vmin;}
  .tsize-l .hand.bottom .tile.drawn{margin-left:0;outline:.3vmin solid rgba(255,255,255,.55);outline-offset:-.3vmin;}
  .hand .tile{width:5.4vmin;height:7.4vmin;}
  .hand.bottom .tile.sel,.hand.bottom .tile:active{transform:translateY(-1.4vmin);}
  .hand.bottom .tile.rec{outline:.35vmin solid var(--gold);outline-offset:-.35vmin;}
  .hand.bottom .tile.kbcur{outline:.45vmin solid #4db6ff;outline-offset:-.45vmin;transform:translateY(-.9vmin);box-shadow:0 0 1.2vmin rgba(77,182,255,.7);}
  /* タップで選択中の牌: 半分持ち上げ(もう一度タップで切る) */
  .hand.bottom .tile.armed{transform:translateY(calc(var(--myhth) * -0.5));z-index:8;outline:.5vmin solid var(--gold);outline-offset:-.5vmin;box-shadow:0 0 2vmin rgba(230,180,34,.95),0 1vmin 1.6vmin rgba(0,0,0,.6);}
  .abtn .kh{font-size:.62em;opacity:.75;margin-left:.3em;font-weight:600;}
  .abtn.kbfocus{outline:.4vmin solid #4db6ff;outline-offset:.3vmin;box-shadow:0 0 1.6vmin rgba(77,182,255,.85);transform:translateY(-.4vmin);}
  /* タップ1回目で選択中の鳴きボタン(もう一度で実行) */
  .abtn.armed{outline:.5vmin solid #fff;outline-offset:.3vmin;transform:translateY(-.6vmin) scale(1.06);box-shadow:0 0 2vmin rgba(255,255,255,.9),0 .5vmin 1.2vmin rgba(0,0,0,.5);animation:armedPulse .9s ease-in-out infinite;}
  @keyframes armedPulse{0%,100%{filter:brightness(1.05);}50%{filter:brightness(1.35);}}
  /* 捨て牌 */
  .discards{position:absolute;display:grid;grid-auto-rows:min-content;gap:1px;z-index:3;grid-template-columns:repeat(6,auto);}
  .discards .tile{width:3.4vmin;height:4.8vmin;}
  /* 捨て牌は中央の四角に沿わせ、外側(手牌側)へ伸ばす */
  .discards.bottom{left:50%;top:calc(50% + 8vmin);bottom:auto;transform:translateX(-50%);}
  .discards.top{left:50%;bottom:calc(50% + 8vmin);top:auto;transform:translateX(-50%) rotate(180deg);}
  .discards.left{right:calc(50% + 10.5vmin);left:auto;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:center;}
  .discards.right{left:calc(50% + 10.5vmin);right:auto;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center;}
  .discards .tile.tsumogiri{opacity:.72;}
  .discards .tile.rdecl{transform:rotate(90deg);margin:0 .8vmin;}
  .discards .tile.last{box-shadow:0 0 0 2px var(--gold);}
  /* 鳴き */
  .melds{position:absolute;display:flex;gap:4px;z-index:6;}
  .melds .tile{width:3.4vmin;height:4.8vmin;}
  /* 晒し牌(鳴き)は手牌に被らないよう、角を作る2辺の両方から内側へ離して表示 */
  .melds.bottom{right:calc(var(--h) + 3vmin);bottom:calc(var(--myh) + 2.6vmin);}
  .melds.top{left:calc(var(--h) + 3vmin);top:calc(var(--topbar-h,5vmin) + var(--h) + 3vmin);transform:rotate(180deg);}
  .melds.left{left:calc(var(--h) + 3vmin);bottom:calc(var(--myh) + 2.6vmin);transform:rotate(90deg) translateX(-100%);transform-origin:left bottom;}
  .melds.right{right:calc(var(--h) + 3vmin);top:calc(var(--topbar-h,5vmin) + var(--h) + 3vmin);transform:rotate(-90deg) translateY(-100%);transform-origin:right top;}
  .meld{display:flex;gap:1px;}
  /* 操作ボタン */
  #controls{position:absolute;left:50%;bottom:10vmin;transform:translateX(-50%);z-index:20;display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center;}
  .abtn{background:linear-gradient(#e6b422,#cf9c14);color:#3a2a00;border:none;padding:1.2vmin 2.6vmin;border-radius:10px;
    font-size:2.4vmin;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #9a7400;}
  .abtn.win{background:linear-gradient(#ff5252,#d32f2f);color:#fff;box-shadow:0 3px 0 #8a1c1c;}
  .abtn.skip{background:linear-gradient(#6b7b70,#55655a);color:#fff;box-shadow:0 3px 0 #33413a;}
  .abtn:active{transform:translateY(2px);box-shadow:none;}
  #msg{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);z-index:30;font-size:4vmin;font-weight:900;
    text-shadow:0 2px 0 #000;opacity:0;transition:opacity .2s;pointer-events:none;}
  #msg.show{opacity:1;}
  .callpop{position:absolute;z-index:25;font-size:3vmin;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #000;
    background:rgba(0,0,0,.55);padding:.4vmin 1.4vmin;border-radius:8px;animation:pop .8s;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{opacity:1}}
  /* ロビー / 結果 */
  .overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,25,14,.8);}
  .overlay.show{display:flex;}
  .sheet{background:linear-gradient(160deg,#173d26,#0d2417);border:2px solid var(--gold);border-radius:16px;
    padding:3vmin 3.5vmin;min-width:min(84vw,460px);max-height:88vh;overflow:auto;text-align:center;}
  .sheet h1{color:var(--gold);margin:.2em 0;font-size:5vmin;}
  .sheet h2{color:var(--gold);margin:.2em 0;}
  .sheet input{font:inherit;font-size:2.4vmin;padding:1vmin 1.4vmin;border-radius:8px;border:1px solid #888;width:60%;text-align:center;margin:1vmin 0;}
  .sheet .row{display:flex;gap:1.5vmin;justify-content:center;flex-wrap:wrap;margin-top:1vmin;}
  .seatctl{display:flex;gap:.6vmin;justify-content:center;flex-wrap:wrap;margin:1vmin 0;font-size:1.7vmin;}
  .seatctl .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:.4vmin 1vmin;cursor:pointer;}
  .final-table{width:100%;border-collapse:collapse;margin:1vmin 0;font-size:2.2vmin;}
  .final-table td{padding:.6vmin;border-top:1px solid rgba(255,255,255,.12);}
  .final-table tr.me{background:rgba(230,180,34,.16);font-weight:800;}
  .agari-tiles{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin:1vmin 0;}
  .agari-tiles .tile{width:4vmin;height:5.6vmin;}
  .yaku-list{list-style:none;padding:0;font-size:2vmin;text-align:left;max-width:40vmin;margin:1vmin auto;}
  .yaku-list li{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.15);padding:.2vmin 0;}
  .yaku-list .han{color:var(--gold);}
  #status{position:absolute;left:1vmin;bottom:1vmin;z-index:8;font-size:1.4vmin;opacity:.7;}
  #topbar #muteBtn.off{background:rgba(200,60,60,.3);border-color:rgba(255,120,120,.55);}
  #topbar #voiceBtn.on{background:rgba(60,200,110,.38);border-color:rgba(120,255,160,.65);}
  /* ルール選択 */
  #rulesBox{display:flex;gap:.6vmin 1.8vmin;flex-wrap:wrap;justify-content:center;align-items:center;font-size:1.9vmin;margin:1vmin 0 .2vmin;}
  #rulesBox label{display:inline-flex;align-items:center;gap:.4vmin;cursor:pointer;white-space:nowrap;}
  #rulesBox input{width:auto!important;margin:0;transform:scale(1.2);}
  #tsizeBox{font-size:1.9vmin;margin:.2vmin 0 1vmin;}
  #tsizeBox label{display:inline-flex;align-items:center;gap:.3vmin;margin:0 .7vmin;cursor:pointer;}
  #tsizeBox input{width:auto!important;margin:0;transform:scale(1.2);}
  /* チャット/スタンプ */
  #chatPanel{position:absolute;left:50%;bottom:calc(var(--h) + 3vmin);transform:translateX(-50%);z-index:40;display:none;
    flex-direction:column;gap:.6vmin;background:rgba(6,32,20,.94);border:1px solid var(--gold);border-radius:12px;
    padding:1vmin 1.2vmin;max-width:min(94vw,540px);}
  #chatPanel.show{display:flex;}
  #stampRow{display:flex;gap:.5vmin;flex-wrap:wrap;justify-content:center;}
  #stampRow .stamp{font-size:2vmin;font-weight:700;color:#fff;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:.5vmin 1vmin;cursor:pointer;white-space:nowrap;}
  #stampRow .stamp:active{transform:translateY(1px);}
  #chatInputRow{display:flex;gap:.6vmin;}
  #chatText{flex:1;font:inherit;font-size:1.9vmin;padding:.5vmin 1vmin;border-radius:8px;border:1px solid #888;min-width:0;}
  #chatSend{font-size:1.9vmin;padding:.5vmin 1.4vmin;}
  .bubble{position:absolute;z-index:35;max-width:26vmin;font-size:1.9vmin;font-weight:700;color:#20130a;
    background:#fff;padding:.5vmin 1.1vmin;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.45);
    animation:bpop .25s;pointer-events:none;word-break:break-word;}
  .bubble .who{display:block;font-size:1.2vmin;font-weight:400;opacity:.6;}
  .bubble.big{font-size:3vmin;}
  @keyframes bpop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  /* 演出: リーチ棒 */
  .rstick{width:5vmin;height:1vmin;background:linear-gradient(#fff,#e9e9e9);border-radius:.5vmin;margin:.4vmin auto 0;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.45);}
  .rstick i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:.8vmin;height:.8vmin;border-radius:50%;background:#e53935;}
  /* 演出: 割れ目の家 */
  .seat.wareme{box-shadow:0 0 0 .3vmin rgba(255,140,40,.85),0 2px 7px rgba(0,0,0,.4);}
  .wbadge{margin-top:.2vmin;font-size:1.3vmin;font-weight:800;color:#3a2a00;background:linear-gradient(#ffb04a,#ff8c1a);border-radius:6px;padding:0 .8vmin;display:inline-block;}
  /* 演出: 直前の捨て牌を強調 */
  .discards .tile.last{box-shadow:0 0 0 .35vmin var(--gold);}
  .discards .tile.justnow{animation:discPop .28s ease-out;}
  @keyframes discPop{0%{transform:translateY(-1.6vmin) scale(1.12);opacity:.4}100%{transform:none;opacity:1}}
  /* 演出: 和了画面のポップイン＆和了牌の脈動 */
  #result.show .sheet{animation:sheetPop .32s cubic-bezier(.2,1.2,.4,1);}
  @keyframes sheetPop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .winpulse{animation:winPulse 1s ease-in-out infinite;}
  @keyframes winPulse{0%,100%{box-shadow:0 0 0 2px var(--gold)}50%{box-shadow:0 0 1.4vmin .3vmin var(--gold)}}
  /* 牌譜リプレイ操作バー */
  #replayBar{position:absolute;left:50%;bottom:calc(var(--myh) + 2.5vmin);transform:translateX(-50%);z-index:45;display:none;align-items:center;gap:1vmin;
    background:rgba(6,32,20,.96);border:1px solid var(--gold);border-radius:12px;padding:.8vmin 1.4vmin;box-shadow:0 3px 12px rgba(0,0,0,.5);}
  #replayBar.show{display:flex;}
  #replayBar button{font:inherit;font-size:2.4vmin;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:.4vmin 1.2vmin;cursor:pointer;}
  #replayBar #rpClose{font-size:1.8vmin;background:linear-gradient(#6b7b70,#55655a);}
  #replayBar #rpIdx{font-size:2vmin;min-width:7vmin;text-align:center;color:var(--gold);font-weight:700;}
  /* タッチ端末では操作ボタンを押しやすいサイズに */
  @media (pointer:coarse){
    #topbar{font-size:2.3vmin;}
    #topbar button{font-size:15px;padding:6px 11px;border-radius:8px;}
    .abtn{font-size:17px;padding:11px 18px;}
    #stampRow .stamp{font-size:15px;padding:8px 12px;}
    #chatText,#chatSend{font-size:16px;}
    .sheet input{font-size:16px;}
  }
</style>
</head>
<body>
<!-- 牌スプライト -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <image id="tsheet" width="350" height="240" preserveAspectRatio="none" href="tiles.png"/>
</defs></svg>

<div id="app">
  <div id="board" style="display:none">
    <div id="topbar">
      <div><span id="roundLbl">東1局</span> <span class="num" id="wallLbl">70</span>枚 <span id="roomLbl" style="color:var(--gold);margin-left:1vmin"></span></div>
      <div><button id="voiceBtn" title="音声通話">🎤</button> <button id="chatBtn" title="スタンプ・チャット">💬</button> <button id="muteBtn" title="音のオン/オフ (M)">🔊</button> <button id="seatBtn">席</button> <button id="leaveBtn">退出</button></div>
    </div>
    <div id="center"></div>
    <div class="discards bottom" data-pos="0"></div><div class="discards right" data-pos="1"></div>
    <div class="discards top" data-pos="2"></div><div class="discards left" data-pos="3"></div>
    <div class="melds bottom" data-pos="0"></div><div class="melds right" data-pos="1"></div>
    <div class="melds top" data-pos="2"></div><div class="melds left" data-pos="3"></div>
    <div class="hand bottom" data-pos="0"></div><div class="hand right" data-pos="1"></div>
    <div class="hand top" data-pos="2"></div><div class="hand left" data-pos="3"></div>
    <div class="seat sc-bottom" data-pos="0"></div><div class="seat sc-right" data-pos="1"></div>
    <div class="seat sc-top" data-pos="2"></div><div class="seat sc-left" data-pos="3"></div>
    <div id="controls"></div>
    <div id="msg"></div>
    <div id="status">未接続</div>
    <div id="voiceAudios" style="display:none"></div>
    <div id="chatPanel">
      <div id="stampRow"></div>
      <div id="chatInputRow">
        <input id="chatText" maxlength="40" placeholder="メッセージ (40字まで)">
        <button id="chatSend" class="abtn">送信</button>
      </div>
    </div>
    <div id="replayBar">
      <button id="rpFirst" title="最初へ">⏮</button>
      <button id="rpPrev" title="前へ">◀</button>
      <span id="rpIdx">1/1</span>
      <button id="rpNext" title="次へ">▶</button>
      <button id="rpLast" title="最後へ">⏭</button>
      <button id="rpClose">結果に戻る</button>
    </div>
  </div>
</div>

<div class="overlay show" id="gate"><div class="sheet">
  <h1>🀄 麻雀オンライン</h1>
  <p>入室するには合言葉が必要です。</p>
  <div><input id="pwInput" type="password" placeholder="合言葉" autocomplete="off" autocapitalize="off" maxlength="64"></div>
  <div class="row"><button class="abtn" id="pwBtn">入室</button></div>
  <div id="gateErr" style="color:#ff8a8a;font-size:1.8vmin;margin-top:1vmin;min-height:1.8vmin"></div>
</div></div>

<div class="overlay" id="lobby"><div class="sheet">
  <h1>麻雀オンライン</h1>
  <p>4人打ちリーチ麻雀。あなた＋人間/CPU3人。<br>途中参加・離脱(CPU代打ち)対応。</p>
  <div><input id="nameInput" placeholder="名前" maxlength="16"></div>
  <div id="rulesBox">
    <label><input type="radio" name="rule_len" value="tonpu">東風戦</label>
    <label><input type="radio" name="rule_len" value="hanchan" checked>半荘戦</label>
    <label><input type="checkbox" id="rule_aka" checked>赤ドラ</label>
    <label><input type="checkbox" id="rule_kuitan" checked>喰いタン</label>
    <label><input type="checkbox" id="rule_tobi" checked>トビ終了</label>
    <label><input type="checkbox" id="rule_wareme">割れ目</label>
  </div>
  <div style="font-size:1.4vmin;opacity:.65;margin:-.3vmin 0 .6vmin">↑ ルールは「1人で」「ルームを作る」に反映（自動マッチング・参加は卓に従う）</div>
  <div id="tsizeBox">牌の大きさ：
    <label><input type="radio" name="tsize" value="s" checked>小</label>
    <label><input type="radio" name="tsize" value="m">中</label>
    <label><input type="radio" name="tsize" value="l">大（2段）</label>
  </div>
  <div class="row">
    <button class="abtn" id="soloBtn">1人で(CPU3人)</button>
    <button class="abtn" id="autoBtn">自動マッチング</button>
  </div>
  <hr style="border:none;border-top:1px solid rgba(255,255,255,.15);margin:2vmin 0;">

    <button class="abtn" id="roomCreateBtn">ルームを作る</button>
    <input id="roomCodeInput" placeholder="合言葉" maxlength="4" style="width:22%;text-transform:uppercase;letter-spacing:.3vmin">
    <button class="abtn" id="roomJoinBtn">参加</button>
  </div>
  <div id="lobbyErr" style="color:#ff8a8a;font-size:1.6vmin;margin-top:1vmin;min-height:1.6vmin"></div>
  <div id="lobbyInfo" style="margin-top:1vmin;font-size:1.7vmin;opacity:.8"></div>
  <div id="statsLine" style="margin-top:1vmin;font-size:1.6vmin;opacity:.9;border-top:1px solid rgba(255,255,255,.12);padding-top:1vmin"></div>
</div></div>

<div class="overlay" id="result"><div class="sheet" id="resultSheet"></div></div>
<div class="overlay" id="seatModal"><div class="sheet" id="seatSheet"></div></div>

<script>
"use strict";
const HONOR=["東","南","西","北","白","發","中"];
const COLX=[5,40,74,108,143,177,212,246,280,315], ROWY=[5,52,99,145,191], ROWH=[44,43,43,44,44], CELLW=31;
const HONOR_CELL={27:[3,0],28:[3,1],29:[4,0],30:[4,1],31:[3,2],32:[3,3],33:[4,2]}, BACK_CELL=[4,3];
const suitOf=t=>t<27?Math.floor(t/9):3, rankOf=t=>t<27?(t%9)+1:0;
function tileUV(t,aka){ if(t<27){const s=suitOf(t),r=rankOf(t);const col=aka?5:(r<=5?r-1:r);return[COLX[col],ROWY[s],CELLW,ROWH[s]];} const c=HONOR_CELL[t];return[COLX[c[1]],ROWY[c[0]],CELLW,ROWH[c[0]]]; }
function svgFace(t,aka,back){ let x,y,w,h; if(back){x=COLX[BACK_CELL[1]];y=ROWY[BACK_CELL[0]];w=CELLW;h=ROWH[BACK_CELL[0]];}else{const uv=tileUV(t,aka);x=uv[0];y=uv[1];w=uv[2];h=uv[3];} return `<svg viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="none"><use href="#tsheet"/></svg>`; }
function tileEl(t,opt={}){ const e=document.createElement("div"); e.className="tile"+(opt.cls?" "+opt.cls:""); if(opt.back){e.classList.add("back");e.innerHTML=svgFace(0,false,true);} else e.innerHTML=svgFace(t.t,!!t.aka,false); return e; }
function faceShort(t){ if(t>=27)return HONOR[t-27]; return (t%9+1)+["m","p","s"][suitOf(t)]; }

// ---- WebSocket ----
let ws, myId=null, myTable=null, mySeat=-1, state=null, pendingReact=null, myOptions=null, myRoomCode=null, isSpectator=false;
// 端末ごとの永続ID(再接続で席に復帰するため)
const PID=(function(){ try{ let p=localStorage.getItem("mj_pid"); if(!p){ p=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2)); localStorage.setItem("mj_pid",p);} return p; }catch(e){ return "anon"+Math.random(); } })();
let sessionPw=null, _pwTry=null, everJoined=false, lastDisc=null, handCursor=0, reactCursor=-1;
// 牌譜リプレイ(この局のstateスナップショットを記録して後で再生)
let replayFrames=[], replayMode=false, replayIdx=0, replaySaved=null;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host);
  ws.onopen=()=>setStatus("接続済み");
  ws.onclose=()=>{ setStatus("切断 - 再接続中"); setTimeout(connect,1500); };
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function sendWS(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function setStatus(s){ document.getElementById("status").textContent=s; }

// =========================================================================
//  効果音 (Web Audioで合成) ＋ 掛け声 (SpeechSynthesis) — 単体版から移植
// =========================================================================
let audioMuted = false;
try{ audioMuted = (localStorage.getItem("mj_muted")==="1"); }catch(e){}
const Sound = {
  ctx:null,
  init(){ const AC=window.AudioContext||window.webkitAudioContext; if(!this.ctx){ if(!AC)return; try{this.ctx=new AC();}catch(e){this.ctx=null;return;} } if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); },
  tone(freq,dur,{type="sine",gain=.12,at=0,slide=0}={}){ if(audioMuted||!this.ctx)return; const t0=this.ctx.currentTime+at; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type;o.frequency.setValueAtTime(freq,t0); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t0+dur); g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(this.ctx.destination);o.start(t0);o.stop(t0+dur+.02); },
  clack(gain=.16){ if(audioMuted||!this.ctx)return; const len=Math.floor(this.ctx.sampleRate*.045); const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6); const src=this.ctx.createBufferSource();src.buffer=buf; const bp=this.ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1900;bp.Q.value=1.1; const g=this.ctx.createGain();g.gain.value=gain; src.connect(bp).connect(g).connect(this.ctx.destination);src.start(); },
  discard(){ this.clack(.13); }, draw(){ this.clack(.06); },
  call(){ this.clack(.18); this.tone(320,.12,{type:"triangle",gain:.13,at:.03}); },
  riichi(){ this.tone(660,.1,{type:"triangle",gain:.13}); this.tone(880,.18,{type:"triangle",gain:.13,at:.1}); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.3,{type:"triangle",gain:.13,at:i*.09})); },
  lose(){ this.tone(300,.35,{type:"sawtooth",gain:.1,slide:-160}); },
  ryuukyoku(){ [440,392,330].forEach((f,i)=>this.tone(f,.25,{type:"sine",gain:.11,at:i*.12})); },
};
const Voice = {
  jaVoices:[], allVoices:[], loaded:false,
  init(){ if(typeof speechSynthesis==="undefined")return; this.refresh(); try{speechSynthesis.onvoiceschanged=()=>this.refresh();}catch(e){} },
  refresh(){ if(typeof speechSynthesis==="undefined")return; this.allVoices=speechSynthesis.getVoices()||[]; this.jaVoices=this.allVoices.filter(v=>/^ja(\b|[-_])/i.test(v.lang)); this.loaded=this.allVoices.length>0; },
  norm(t){ return ({"ダブリー":"ダブルリーチ"})[t]||t; },
  say(text,pos=0){ if(audioMuted||typeof speechSynthesis==="undefined")return; if(!this.loaded)this.refresh(); const u=new SpeechSynthesisUtterance(this.norm(text)); u.lang="ja-JP"; const list=this.jaVoices.length?this.jaVoices:this.allVoices; if(list.length)u.voice=list[pos%list.length]; u.pitch=[1.15,.85,1.05,.75][pos%4]; u.rate=[1.08,1.0,1.02,.96][pos%4]; u.volume=1; try{speechSynthesis.speak(u);}catch(e){} },
};
function audioKick(){ Sound.init(); if(!Voice.loaded) Voice.refresh(); }
// 最初のユーザー操作で音を有効化(モバイルの自動再生制限対策)
["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev,audioKick,{once:false,passive:true}));
function setMuteBtn(){ const b=document.getElementById("muteBtn"); if(b){ b.textContent=audioMuted?"🔇":"🔊"; b.classList.toggle("off",audioMuted); } }
function toggleMute(){ audioMuted=!audioMuted; try{localStorage.setItem("mj_muted",audioMuted?"1":"0");}catch(e){} setMuteBtn(); if(!audioMuted){ audioKick(); Sound.tone(600,.1,{type:"triangle",gain:.12}); } else { try{speechSynthesis.cancel();}catch(e){} } }
Voice.init(); setMuteBtn();

function handle(m){
  switch(m.t){
    case "hello": myId=m.id; if(!m.needAuth){ if(everJoined) sendWS({t:"rejoin",pid:PID}); else showLobby(); } else if(sessionPw){ sendWS({t:"auth",password:sessionPw}); } else document.getElementById("pwInput").focus(); break;
    case "authOk": if(_pwTry) sessionPw=_pwTry; if(everJoined){ const nm=(localStorage.getItem("mj_name")||"").trim(); if(nm) sendWS({t:"setName",name:nm}); sendWS({t:"rejoin",pid:PID}); } else showLobby(); break;
    case "authFail": gateFail(m.remaining); break;
    case "locked": gateLocked(m.seconds); break;
    case "rejoinFail": isSpectator=false; showLobby(); break;
    case "lobby": renderLobby(m); break;
    case "joined": everJoined=true; isSpectator=false; mySeat=m.seat; myTable=m.tableId; myRoomCode=m.roomCode||null; document.getElementById("lobby").classList.remove("show"); document.getElementById("board").style.display=""; document.getElementById("seatBtn").style.display=""; document.getElementById("roomLbl").textContent=myRoomCode?("🔑"+myRoomCode):""; if(m.mode==="rejoin") flash("席に復帰しました",2000); else if(myRoomCode) flash("合言葉: "+myRoomCode+" (共有して友人を招待)",3000); blurInputs(); setTimeout(fitTop,60); break;
    case "spectating": isSpectator=true; document.getElementById("lobby").classList.remove("show"); document.getElementById("board").style.display=""; document.getElementById("roomLbl").textContent="👀 観戦中"; document.getElementById("seatBtn").style.display="none"; flash("👀 観戦モード",2000); blurInputs(); setTimeout(fitTop,60); break;
    case "error": document.getElementById("lobbyErr").textContent=m.msg; break;
    case "state": if(replayMode) break; state=m.state; mySeat=state.seat; render(); if(state.phase==="playing") replayFrames.push(JSON.parse(JSON.stringify(state))); break;
    case "yourTurn": myOptions=m.options; showTurnControls(); Sound.draw(); break;
    case "canReact": pendingReact=m; showReactControls(); break;
    case "call": popCall(m.seat, m.kind); onCallSound(m.seat, m.kind); break;
    case "discard": Sound.discard(); lastDisc={seat:m.seat,id:m.tile&&m.tile.id,fresh:true}; break;
    case "seatChange": flash((m.name||"席")+" 交代"); break;
    case "handEnd": showResult(m.result); onHandEndSound(m.result); Stats.recordHand(m.result); break;
    case "gameOver": showGameOver(m); Stats.recordGame(m); break;
    case "chat": showBubble(m.seat, m.stamp||m.text, m.name, !!m.stamp); break;
    case "voice": handleVoice(m); break;
    case "handStart": document.getElementById("result").classList.remove("show"); replayFrames=[]; break;
    case "diceDealer": showDiceDealer(m); break;
  }
}
function onCallSound(seat,kind){ const pos=seatToPos(seat);
  if(kind==="リーチ"||kind==="ダブリー") Sound.riichi(); else Sound.call();
  Voice.say(kind, pos);
}
function onHandEndSound(r){ if(!r)return;
  if(r.kind==="tsumo"||r.kind==="ron"){ const w=r.winners&&r.winners[0]; Voice.say(r.kind==="tsumo"?"ツモ":"ロン", w?seatToPos(w.seat):0); Sound.win(); }
  else { Sound.ryuukyoku(); }
}

// ---- 合言葉(パスワード)ゲート ----
function showLobby(){ document.getElementById("gate").classList.remove("show"); document.getElementById("gateErr").textContent=""; if(lockTimer){clearInterval(lockTimer);lockTimer=null;} document.getElementById("lobby").classList.add("show"); const n=document.getElementById("nameInput"); if(n) n.focus(); }
function submitPw(){ const v=document.getElementById("pwInput").value; if(!v){ document.getElementById("gateErr").textContent="合言葉を入力してください。"; return; } _pwTry=v; sendWS({t:"auth",password:v}); }
function gateFail(remaining){ const el=document.getElementById("gateErr"); el.textContent="合言葉が違います。あと "+remaining+" 回間違えると10分間ロックされます。"; const p=document.getElementById("pwInput"); p.value=""; p.focus(); }
let lockTimer=null;
function gateLocked(seconds){
  const inp=document.getElementById("pwInput"), btn=document.getElementById("pwBtn"), el=document.getElementById("gateErr");
  inp.disabled=true; btn.disabled=true; inp.value="";
  let s=Math.max(0,seconds|0);
  const tick=()=>{
    const mm=Math.floor(s/60), ss=String(s%60).padStart(2,"0");
    if(s>0){ el.textContent="間違いが3回に達しました。あと "+mm+":"+ss+" 待ってください。"; }
    else { clearInterval(lockTimer); lockTimer=null; inp.disabled=false; btn.disabled=false; el.textContent="もう一度入力できます。"; inp.focus(); }
    s--;
  };
  clearInterval(lockTimer); tick(); lockTimer=setInterval(tick,1000);
}
document.getElementById("pwBtn").onclick=submitPw;
document.getElementById("pwInput").addEventListener("keydown",e=>{ if(e.key==="Enter") submitPw(); });

// ---- 画面: ロビー ----
function renderLobby(m){
  const el=document.getElementById("lobbyInfo");
  const ongoing=(m.tables||[]).filter(t=>t.phase!=="gameOver");
  if(!ongoing.length){ el.textContent="対局中の卓: 0"; return; }
  el.innerHTML="👀 進行中の卓を観戦：<br>"+ongoing.map(t=>
    `<span style="display:inline-flex;align-items:center;gap:.5vmin;margin:.4vmin .6vmin">卓${String(t.id).replace(/^t/,'')}(${t.humans}人) <button class="abtn" style="font-size:1.5vmin;padding:.3vmin 1vmin;box-shadow:0 2px 0 #9a7400" onclick="sendWS({t:'spectate',tableId:'${t.id}'})">観戦</button></span>`
  ).join(" ");
}
document.getElementById("soloBtn").onclick=()=>{ audioKick(); const n=document.getElementById("nameInput").value.trim(); if(n){sendWS({t:"setName",name:n});saveName();} sendWS({t:"join",mode:"solo",rules:getRules(),pid:PID}); };
document.getElementById("autoBtn").onclick=()=>{ audioKick(); const n=document.getElementById("nameInput").value.trim(); if(n){sendWS({t:"setName",name:n});saveName();} sendWS({t:"join",mode:"auto",pid:PID}); };
document.getElementById("leaveBtn").onclick=()=>{ sendWS({t:"leave"}); location.reload(); };
document.getElementById("seatBtn").onclick=showSeatModal;
document.getElementById("muteBtn").onclick=toggleMute;
window.addEventListener("keydown",e=>{ if((e.key==="m"||e.key==="M") && document.activeElement && document.activeElement.tagName!=="INPUT"){ toggleMute(); } });
// ---- キーボード操作(打牌/鳴き/和了) ----
window.addEventListener("keydown",e=>{
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")) return;   // 文字入力中は無効
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  // 結果画面: Enterで「次へ」
  if(document.getElementById("result").classList.contains("show")){
    if(e.key==="Enter"){ const rb=document.getElementById("readyBtn"); if(rb){e.preventDefault();rb.click();} }
    return;
  }
  // リプレイ中: ←→で移動、Escで戻る
  if(replayMode){
    if(e.key==="ArrowLeft"){e.preventDefault();showFrame(replayIdx-1);}
    else if(e.key==="ArrowRight"){e.preventDefault();showFrame(replayIdx+1);}
    else if(e.key==="Home"){e.preventDefault();showFrame(0);}
    else if(e.key==="End"){e.preventDefault();showFrame(replayFrames.length-1);}
    else if(e.key==="Escape"){e.preventDefault();exitReplay();}
    return;
  }
  const ctl=document.getElementById("controls");
  // 反応(ロン/ポン/チー/カン/スキップ): 数字で選択、Escでスキップ
  if(pendingReact){
    if(e.key==="Escape"){ const sk=ctl.querySelector('button[data-key="skip"]'); if(sk){e.preventDefault();sk.click();} return; }
    if(e.key==="ArrowUp"||e.key==="ArrowLeft"){ e.preventDefault(); moveReactCursor(-1); return; }
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){ e.preventDefault(); moveReactCursor(1); return; }
    if(e.key==="Enter"||e.key===" "){ const bs=reactBtns(); if(reactCursor>=0&&bs[reactCursor]){ e.preventDefault(); bs[reactCursor].click(); } return; }
    const bn=ctl.querySelector('button[data-key="'+e.key+'"]'); if(bn){e.preventDefault();bn.click();}
    return;
  }
  // 自分の手番: 打牌(←→で選ぶ, Enter/Spaceで切る, 数字で直接), T/R/K=ツモ/リーチ/カン
  if(myOptions){
    const kk=e.key.toLowerCase();
    const byKey=ctl.querySelector('button[data-key="'+kk+'"]'); if(byKey){e.preventDefault();byKey.click();return;}
    if(e.key==="Escape"){ const sk=ctl.querySelector('button[data-key="skip"]'); if(sk){e.preventDefault();sk.click();return;} }
    const p=state&&state.players[mySeat];
    const tiles=p?[...(p.hand||[]),...(p.drawn?[p.drawn]:[])]:[];
    if(!tiles.length) return;
    if(e.key==="ArrowLeft"){e.preventDefault(); armedTile=null; handCursor=(handCursor-1+tiles.length)%tiles.length; updateHandCursor();}
    else if(e.key==="ArrowRight"){e.preventDefault(); armedTile=null; handCursor=(handCursor+1)%tiles.length; updateHandCursor();}
    else if(e.key==="ArrowUp"){e.preventDefault(); moveCursorRow(-1);}
    else if(e.key==="ArrowDown"){e.preventDefault(); moveCursorRow(1);}
    else if(e.key==="Enter"||e.key===" "){e.preventDefault(); const t=tiles[Math.min(Math.max(handCursor,0),tiles.length-1)]; if(t) onTileClick(t);}  // 選択中の牌を切る
    else if(/^[0-9]$/.test(e.key)){ const idx=e.key==="0"?9:(+e.key-1); if(tiles[idx]){e.preventDefault(); handCursor=idx; onTileClick(tiles[idx]);} }
  }
});
// 名前を記憶(次回から自動入力)
(function(){ try{ const saved=localStorage.getItem("mj_name"); if(saved) document.getElementById("nameInput").value=saved; }catch(e){} })();
function saveName(){ const n=document.getElementById("nameInput").value.trim(); if(n){ try{localStorage.setItem("mj_name",n);}catch(e){} } }
// ルール(東風/半荘・赤/喰い/トビ)の取得・記憶・復元
function getRules(){ const r={
  hanchan: (document.querySelector('input[name=rule_len]:checked')||{}).value==="hanchan",
  aka: document.getElementById("rule_aka").checked,
  kuitan: document.getElementById("rule_kuitan").checked,
  tobi: document.getElementById("rule_tobi").checked,
  wareme: document.getElementById("rule_wareme").checked };
  try{ localStorage.setItem("mj_rules", JSON.stringify(r)); }catch(e){}
  return r; }
(function(){ try{ const r=JSON.parse(localStorage.getItem("mj_rules")||"null"); if(r){
  // 局長(東風/半荘)は既定(半荘)を優先し復元しない。赤・喰い・トビ・割れ目は前回を復元。
  document.getElementById("rule_aka").checked=r.aka!==false;
  document.getElementById("rule_kuitan").checked=r.kuitan!==false;
  document.getElementById("rule_tobi").checked=r.tobi!==false;
  document.getElementById("rule_wareme").checked=!!r.wareme;
} }catch(e){} })();
// 牌の大きさ(小/中/大) 選択・適用・記憶
function applyTileSize(sz){ const el=document.documentElement; el.classList.remove("tsize-m","tsize-l"); if(sz==="m")el.classList.add("tsize-m"); else if(sz==="l")el.classList.add("tsize-l"); try{localStorage.setItem("mj_tsize",sz);}catch(e){} if(typeof state!=="undefined"&&state)render(); }
(function(){ let sz="s"; try{ sz=localStorage.getItem("mj_tsize")||"s"; }catch(e){} const r=document.querySelector('input[name=tsize][value="'+sz+'"]'); if(r)r.checked=true; applyTileSize(sz);
  document.querySelectorAll('input[name=tsize]').forEach(inp=>inp.addEventListener("change",()=>{ if(inp.checked) applyTileSize(inp.value); })); })();

// ---- 通算成績(順位・和了率・ポイント) localStorage ----
const Stats={
  key:"mj_stats",
  blank(){ return {games:0,r1:0,r2:0,r3:0,r4:0,pt:0,hands:0,wins:0}; },
  load(){ try{ return Object.assign(this.blank(), JSON.parse(localStorage.getItem(this.key)||"{}")); }catch(e){ return this.blank(); } },
  save(s){ try{ localStorage.setItem(this.key, JSON.stringify(s)); }catch(e){} },
  recordHand(result){ if(!result) return; const s=this.load(); s.hands++; if(result.winners && result.winners.some(w=>w.seat===mySeat)) s.wins++; this.save(s); },
  recordGame(m){ const e=(m.ranking||[]).find(x=>x.seat===mySeat); if(!e) return; const s=this.load(); s.games++; s["r"+e.rank]=(s["r"+e.rank]||0)+1; if(typeof e.pt==="number") s.pt+=e.pt; this.save(s); this.render(); },
  render(){ const el=document.getElementById("statsLine"); if(!el) return; const s=this.load();
    if(!s.games){ el.textContent="通算成績: まだありません"; return; }
    const avg=((s.r1+s.r2*2+s.r3*3+s.r4*4)/s.games).toFixed(2);
    const top=Math.round(100*s.r1/s.games), ren=Math.round(100*(s.r1+s.r2)/s.games);
    const wr=s.hands?(100*s.wins/s.hands).toFixed(1):"-";
    el.innerHTML=`通算 <b>${s.games}</b>戦 ・ 平均順位 <b>${avg}</b> ・ トップ率 ${top}% ・ 連対 ${ren}% ・ 和了率 ${wr}% ・ ポイント <b style="color:${s.pt>=0?'#7fffa0':'#ff8a8a'}">${s.pt>0?"+"+s.pt:s.pt}</b> <a href="#" id="statsReset" style="opacity:.6;margin-left:.8vmin">リセット</a>`;
    const rb=document.getElementById("statsReset"); if(rb) rb.onclick=(ev)=>{ ev.preventDefault(); if(confirm("通算成績をリセットしますか？")){ this.save(this.blank()); this.render(); } };
  }
};
Stats.render();
function nameFirst(){ audioKick(); const n=document.getElementById("nameInput").value.trim(); if(n){sendWS({t:"setName",name:n});saveName();} }
document.getElementById("roomCreateBtn").onclick=()=>{ nameFirst(); sendWS({t:"createRoom",rules:getRules(),pid:PID}); };
document.getElementById("roomJoinBtn").onclick=()=>{ const code=document.getElementById("roomCodeInput").value.trim().toUpperCase(); if(!code){document.getElementById("lobbyErr").textContent="合言葉を入力してください";return;} nameFirst(); sendWS({t:"joinRoom",code,pid:PID}); };

// pos = 画面位置(0下=自分,1右,2上,3左)。server seat -> pos
function seatToPos(seat){ return (seat - mySeat + 4)%4; }

// ---- 盤面描画 ----
function render(){
  if(!state) return;
  document.getElementById("roundLbl").textContent=(state.wRound===0?"東":"南")+(state.round%4+1)+"局"+(state.honba?" "+state.honba+"本場":"");

function updateHandCursor(){ const he=document.querySelector('.hand[data-pos="0"]'); if(!he)return; const tiles=[...he.children]; if(!tiles.length)return; if(handCursor>=tiles.length)handCursor=tiles.length-1; if(handCursor<0)handCursor=0; tiles.forEach((el,i)=>el.classList.toggle("kbcur", i===handCursor && !!myOptions)); }
function blurInputs(){ const a=document.activeElement; if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")) a.blur(); }

function updateReactCursor(){ const bs=reactBtns(); bs.forEach((b,i)=>b.classList.toggle("kbfocus", i===reactCursor)); }
function moveReactCursor(d){ const bs=reactBtns(); if(!bs.length)return; bs.forEach(b=>b.classList.remove("armed")); if(reactCursor<0) reactCursor=(d>0?0:bs.length-1); else reactCursor=(reactCursor+d+bs.length)%bs.length; updateReactCursor(); }
// 上下キー: 2段折り返し時に上段/下段の同じ位置あたりの牌へカーソル移動
function moveCursorRow(dir){
  const he=document.querySelector('.hand[data-pos="0"]'); if(!he)return;
  const tiles=[...he.children]; if(!tiles.length)return;
  const cur=tiles[Math.min(Math.max(handCursor,0),tiles.length-1)]; const cr=cur.getBoundingClientRect();
  const cx=(cr.left+cr.right)/2; let best=-1,bestDx=1e9;
  tiles.forEach((el,i)=>{ const r=el.getBoundingClientRect();
    const other = dir<0 ? r.top < cr.top-2 : r.top > cr.top+2;
    if(other){ const dx=Math.abs((r.left+r.right)/2-cx); if(dx<bestDx){bestDx=dx;best=i;} }
  });
  if(best>=0){ handCursor=best; updateHandCursor(); }
}

// ---- 音声通話 (WebRTC P2P メッシュ) ----
const RTC_CONFIG={ iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"}
]};
let voiceOn=false, localStream=null, peers={};   // seat -> RTCPeerConnection
function setVoiceBtn(){ const b=document.getElementById("voiceBtn"); if(!b)return; b.textContent=voiceOn?"🎙":"🎤"; b.classList.toggle("on",voiceOn); }
function vsig(to,data){ sendWS({t:"voice",sub:"signal",to,data}); }
async function voiceToggle(){
  if(isSpectator){ flash("観戦中は通話できません",1500); return; }
  if(voiceOn){ leaveVoice(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ flash("この環境では通話できません",2000); return; }
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }
  catch(e){ flash("マイクの使用が許可されていません",2200); return; }
  voiceOn=true; setVoiceBtn(); sendWS({t:"voice",sub:"join"}); flash("🎙 音声通話に参加中",1600);
}
function leaveVoice(){
  if(voiceOn) sendWS({t:"voice",sub:"leave"});
  for(const s in peers){ try{peers[s].close();}catch(e){} }
  peers={}; document.getElementById("voiceAudios").innerHTML="";
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  const wasOn=voiceOn; voiceOn=false; setVoiceBtn(); if(wasOn) flash("音声通話から退出",1200);
}
function ensurePeer(seat){
  if(peers[seat]) return peers[seat];
  const pc=new RTCPeerConnection(RTC_CONFIG); peers[seat]=pc;
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate) vsig(seat,{type:"ice",candidate:e.candidate}); };
  pc.ontrack=e=>{ let a=document.getElementById("va"+seat); if(!a){ a=document.createElement("audio"); a.id="va"+seat; a.autoplay=true; a.playsInline=true; document.getElementById("voiceAudios").append(a);} a.srcObject=e.streams[0]; a.play&&a.play().catch(()=>{}); };
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==="failed"||pc.connectionState==="closed") closePeer(seat); };
  return pc;
}
function closePeer(seat){ if(peers[seat]){ try{peers[seat].close();}catch(e){} delete peers[seat]; } const a=document.getElementById("va"+seat); if(a) a.remove(); }
async function startOffer(seat){ const pc=ensurePeer(seat); try{ const o=await pc.createOffer(); await pc.setLocalDescription(o); vsig(seat,{type:"offer",sdp:pc.localDescription}); }catch(e){} }
async function handleVoice(m){
  if(m.sub==="members"){ if(!voiceOn)return; for(const s of m.seats){ if(mySeat<s) startOffer(s); else ensurePeer(s); } }
  else if(m.sub==="join"){ if(!voiceOn)return; const s=m.seat; if(mySeat<s) startOffer(s); else ensurePeer(s); }
  else if(m.sub==="leave"){ closePeer(m.seat); }
  else if(m.sub==="signal"){ const s=m.from,d=m.data,pc=ensurePeer(s);
    try{
      if(d.type==="offer"){ await pc.setRemoteDescription(d.sdp); const a=await pc.createAnswer(); await pc.setLocalDescription(a); vsig(s,{type:"answer",sdp:pc.localDescription}); }
      else if(d.type==="answer"){ await pc.setRemoteDescription(d.sdp); }
      else if(d.type==="ice"){ await pc.addIceCandidate(d.candidate); }
    }catch(e){}
  }
}

    h+="</div>"; }
  h+="</div><div style='font-size:1.5vmin;opacity:.7'>切断すると自動でCPUが代打ちします。CPU席には他の人が自動マッチングで参加できます。</div>";
  h+='<div class="row"><button class="abtn skip" onclick="document.getElementById(\'seatModal\').classList.remove(\'show\')">閉じる</button></div>';
  sh.innerHTML=h; document.getElementById("seatModal").classList.add("show");
}
window.sendWS=sendWS;
// ヘッダーバーの高さを実測し、対面(上)の手牌/鳴きがバーに隠れないよう連動させる
function fitTop(){ const tb=document.getElementById("topbar"); if(tb&&tb.offsetHeight) document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight+"px"); }
window.addEventListener("resize",fitTop);
window.addEventListener("orientationchange",()=>setTimeout(fitTop,200));
connect();
// PWA: Service Worker 登録(ホーム画面に追加＆牌画像キャッシュ)
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
